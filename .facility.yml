version: 1
repositories:
  primary: "github.com/kachiokeke/facility-sandbox"
  related: []
environment:
  setup: "npm ci"
  start: "pgrep -f '[n]ode server.js' >/dev/null || nohup npm run start >/tmp/facility-sandbox.log 2>&1 &"
  ready: "curl --fail http://localhost:3000/health"
  services:
    app:
      port: 3000
      protocol: http
      websocket: true
